version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      outillage:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8 ne supporte que TypeScript < 6.1.
      - dependency-name: typescript
        versions: ['>=6.1.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
